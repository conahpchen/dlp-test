pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
stream {
  resolver 127.0.0.11 valid=5s ipv6=off;
  proxy_connect_timeout 2s;
  proxy_timeout 15s;

  # Targets are fixed by deployment configuration. No request-controlled addressing.
  server {
    listen 8080;
    set $visitor visitor:8080;
    proxy_pass $visitor;
  }
  server {
    listen 2222;
    set $cowrie cowrie:2222;
    proxy_pass $cowrie;
  }
  server {
    listen 3307;
    set $mysql mysql:3307;
    proxy_pass $mysql;
  }
}
