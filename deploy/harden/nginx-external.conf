# Standalone HTTPS edge. Only allowlisted visitor paths reach the upstream.
# Install the reviewed certificate/key paths below for the actual deployment.
pid /tmp/honeynet-edge.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
  access_log off;
  server_tokens off;
  client_max_body_size 1m;
  client_body_temp_path /tmp/honey-client;
  proxy_temp_path /tmp/honey-proxy;
  fastcgi_temp_path /tmp/honey-fastcgi;
  uwsgi_temp_path /tmp/honey-uwsgi;
  scgi_temp_path /tmp/honey-scgi;

  server {
    listen 127.0.0.1:8443 ssl;
    ssl_certificate /edge/tls.crt;
    ssl_certificate_key /edge/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ "^(?:/|/ui|/v1/(?:models|chat/completions)|/decoy/[a-f0-9]{32}/[a-zA-Z0-9/_.-]+|/api/(?:login|assets|announcements|people|tickets(?:/[A-Za-z0-9_-]+){0,2}|dashboard|applications|databases|documents|changes(?:/[A-Za-z0-9_-]+){0,2}))$" {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Forwarded "";
      proxy_set_header X-Control-Token "";
      proxy_hide_header X-Deception;
      proxy_connect_timeout 2s;
      proxy_read_timeout 20s;
    }
    location / { return 404; }
  }
}
