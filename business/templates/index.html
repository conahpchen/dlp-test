<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>澄川 · 研发服务平台</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#243449;background:#f3f5f9}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:#24405c;border:1px solid #d6deea;border-radius:6px;padding:7px 14px}button:hover{border-color:#3275dc;color:#2369ca}.primary{background:#2468d4;color:white;border-color:#2468d4}input,select,textarea{padding:9px;border:1px solid #d6deea;border-radius:5px;background:white}textarea{width:100%;min-height:110px}a{color:#2167cc;cursor:pointer}h1,h2,h3{line-height:1.4}h2{font-size:22px}h3{font-size:16px}.muted{color:#8190a4;font-size:12px}.card{background:white;padding:24px;border:1px solid #e3e8f0;border-radius:9px;margin-bottom:18px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric strong{display:block;font-size:32px;color:#224975}.tag{display:inline-block;background:#edf3fc;color:#2762af;border-radius:4px;padding:2px 8px;font-size:12px}.tag.closed,.tag.resolved,.tag.deployed{background:#eaf7f0;color:#278354}.tag.open,.tag.draft{background:#fff5e4;color:#a87014}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:13px 12px;text-align:left;border-bottom:1px solid #edf0f5}th{color:#78869b;font-weight:500;background:#fafbfd}tr:hover td{background:#fafcff}.scroll{overflow:auto}.desc{white-space:pre-wrap;overflow-wrap:anywhere}.field{margin-bottom:16px}.field label{display:block;color:#67778e;margin-bottom:5px}.field input,.field select{width:100%}#shell{display:none}aside{position:fixed;inset:0 auto 0 0;width:222px;background:#13283f;color:#a6b7ca;padding:24px 14px}aside h2{color:white;font-size:19px;padding:0 10px;margin-bottom:35px}nav button{display:block;width:100%;text-align:left;color:#b8c8db;background:transparent;border:0;margin:5px 0;padding:11px 15px}nav button.active{background:#245fba;color:white}main{margin-left:222px}header{height:70px;padding:0 32px;display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid #e2e7ef}#view{padding:28px 32px;max-width:1500px;margin:auto}#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#122a47,#24558e)}#login .card{width:min(420px,94vw);padding:38px}#notice{position:fixed;bottom:24px;right:24px;background:#263e58;color:white;padding:14px 24px;z-index:99;border-radius:8px;display:none;max-width:80vw}dialog{border:0;border-radius:10px;width:min(640px,94vw);padding:28px;box-shadow:0 20px 80px #13283f44}dialog::backdrop{background:#10253a66}.history{border-left:2px solid #e0e8f5;padding:5px 0 5px 18px;margin:12px 0}.hero{background:linear-gradient(110deg,#edf4ff,#fff);border-color:#dce7f9}.empty{padding:30px;text-align:center;color:#8190a4}.kv{display:grid;grid-template-columns:130px 1fr;gap:12px;margin:12px 0}code{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:850px){aside{width:160px}main{margin-left:160px}.grid,.metrics{grid-template-columns:1fr 1fr}#view{padding:18px}header{padding:12px;height:auto}}@media(max-width:550px){aside{position:static;width:auto;padding:10px}aside h2{margin:5px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{margin:0}.grid,.metrics{grid-template-columns:1fr}}
</style>
<div id="login"><form class="card" id="loginForm"><span class="tag">CHENGCHUAN WORKSPACE</span><h1>澄川研发服务平台</h1><p class="muted">连接研发交付与日常服务</p><div class="field"><label for="username">员工账号</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">登录工作空间</button><p id="loginError" role="alert"></p><p class="muted">内部工作空间 · 仅限授权人员访问</p></form></div>
<div id="shell"><aside><h2>◈ 澄川 / Workspace</h2><nav id="nav"></nav><p class="muted" style="padding:15px">研发运营中心<br>服务管理 · 持续交付</p></aside><main><header><span id="crumb"></span><div class="row"><span id="me"></span><button id="logout">退出</button></div></header><div id="view"></div></main></div><dialog id="modal"></dialog><div id="notice" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{if(!d)return '—';const v=new Date(d);return Number.isNaN(v.getTime())?esc(d):esc(new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(v))};
let token=sessionStorage.getItem('cc_token'),me=JSON.parse(sessionStorage.getItem('cc_me')||'null'),page='dashboard',people=[],apps=[],current=null;
const pages={dashboard:'工作台',tickets:'工单中心',applications:'应用目录',assets:'资产与依赖',changes:'变更与发布',databases:'数据库中心',documents:'知识库',announcements:'公告通知',audit:'操作审计'};
const labels={open:'待受理',in_progress:'处理中',resolved:'待确认',closed:'已关闭',draft:'待测试',tested:'待审批',approved:'待发布',deployed:'已发布',rolled_back:'已回滚'};
const tag=s=>`<span class="tag ${esc(s)}">${esc(labels[s]||s)}</span>`,person=u=>esc(people.find(p=>p.username===u)?.display_name||u||'未分派');
function toast(msg){$('notice').textContent=msg;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',4500)}
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok){if(r.status===401)logout();throw Error(data.detail||data.error||'请求失败')}return data}
function logout(){token=null;me=null;sessionStorage.removeItem('cc_token');sessionStorage.removeItem('cc_me');$('shell').style.display='none';$('login').style.display='grid'}
$('logout').onclick=logout;
$('loginForm').onsubmit=async e=>{e.preventDefault();try{me=await api('login',{username:$('username').value,password:$('password').value});token=me.token;sessionStorage.setItem('cc_token',token);sessionStorage.setItem('cc_me',JSON.stringify(me));await init()}catch(e){$('loginError').textContent=e.message}};
async function init(){try{[people,apps]=await Promise.all([api('people'),api('applications')]);$('login').style.display='none';$('shell').style.display='block';$('me').innerHTML=person(me.username)+' <span class="muted">'+esc(me.username)+'</span>';$('nav').innerHTML=Object.entries(pages).map(([k,v])=>`<button data-page="${k}">${v}</button>`).join('');go('dashboard')}catch(e){toast(e.message)}}
$('nav').onclick=e=>{if(e.target.dataset.page)go(e.target.dataset.page)};
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">暂无符合条件的记录</td></tr>`}</tbody></table></div>`}
function ticketRows(rows){return rows.map(t=>`<tr><td><a data-ticket="${esc(t.key)}">${esc(t.key)}</a></td><td><a data-ticket="${esc(t.key)}">${esc(t.title)}</a></td><td>${tag(t.status)}</td><td>${esc(t.priority)}</td><td>${person(t.assignee)}</td><td>${fmt(t.updated_at)}</td></tr>`)}
async function go(p){page=p;$('crumb').textContent=pages[p];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$('view').innerHTML='<p class="muted">正在读取工作空间…</p>';try{await render(p)}catch(e){$('view').textContent=e.message;toast(e.message)}}
async function render(p){let html=`<div class="row between"><h2>${pages[p]}</h2>`;
if(p==='tickets')html+='<button class="primary" data-action="new-ticket">＋ 新建工单</button>';
if(p==='changes')html+='<button class="primary" data-action="new-change">＋ 申请变更</button>';html+='</div>';
if(p==='dashboard'){const [s,rows,ann]=await Promise.all([api('dashboard'),api('tickets'),api('announcements')]);html+=`<div class="card hero"><span class="tag">研发运营 / 服务概览</span><h2>${person(me.username)}，欢迎回来</h2><p>关注待办、跟进变更，保持交付过程可追溯。</p></div><div class="metrics">${[['全部工单',s.total],['待受理',s.open],['处理中',s.in_progress],['待确认',s.resolved]].map(([k,v])=>`<div class="card metric"><span class="muted">${k}</span><strong>${v}</strong></div>`).join('')}</div><div class="card"><h3>我的待办</h3>${table(['编号','主题','状态','优先级','处理人','更新时间'],ticketRows(rows.filter(t=>t.assignee===me.username&&!['closed','resolved'].includes(t.status))))}</div><div class="card"><h3>团队公告</h3>${ann.map(a=>`<h3>${esc(a.title)}</h3><p>${esc(a.body)}</p>`).join('')}</div>`}
else if(p==='tickets'){html+=`<div class="card"><div class="row"><input id="query" placeholder="搜索编号、标题或业务内容"><select id="statusFilter"><option value="">全部状态</option>${['open','in_progress','resolved','closed'].map(s=>`<option value="${s}">${labels[s]}</option>`).join('')}</select><button data-action="filter">查询</button></div><div id="ticketTable" style="margin-top:16px"></div></div>`;$('view').innerHTML=html;await filter();return}
else if(p==='applications'){html+='<div class="grid">'+apps.map(a=>`<div class="card"><span class="tag">${esc(a.environment)} · ${esc(a.tier)}</span><h3>${esc(a.name)}</h3><p class="muted">${esc(a.key)} / ${esc(a.release_version)}</p><p>负责人：${person(a.owner)}</p><p>主机：${esc(a.hosts.join(', '))}</p><p>依赖：${esc(a.dependencies.join(', ')||'无')}</p></div>`).join('')+'</div>'}
else if(p==='assets'){const a=await api('assets');html+='<div class="grid">'+a.hosts.map(h=>`<div class="card"><h3>${esc(h.hostname)}</h3><p>${esc(h.ip)}</p><p class="muted">${esc(h.os)}</p><p>${h.services.map(s=>`<span class="tag">${esc(s.proto)}:${s.port}</span>`).join(' ')}</p><p>应用：${esc(apps.filter(a=>a.hosts.includes(h.hostname)).map(a=>a.name).join('、')||'基础接入服务')}</p></div>`).join('')+`</div><div class="card"><h3>网络依赖关系</h3><p class="muted">来自资产事实中的关系记录，${a.relations.length} 条</p>${table(['源实体','目标实体','关系','端口'],a.relations.map(r=>`<tr><td>${esc(a.hosts.find(h=>h.entity_id===r.from)?.hostname||r.from)}</td><td>${esc(a.hosts.find(h=>h.entity_id===r.to)?.hostname||r.to)}</td><td>${esc(r.kind)}</td><td>${esc(r.ports.join(', '))}</td></tr>`))}</div>`}
else if(p==='changes'){const rows=await api('changes');html+=rows.map(c=>`<div class="card"><div class="row between"><h3>${esc(c.key)} · ${esc(c.title)}</h3>${tag(c.status)}</div><p>关联工单：<a data-ticket="${esc(c.ticket)}">${esc(c.ticket)}</a> · 负责人：${person(c.owner)} · 风险：${esc(c.risk)}</p><div class="kv"><span class="muted">执行方案</span><span class="desc">${esc(c.plan)}</span><span class="muted">回滚方案</span><span class="desc">${esc(c.rollback)}</span></div>${c.history.map(h=>`<div class="history">${person(h.actor)} · ${esc(h.action)} <span class="muted">${fmt(h.time)}</span><div>${esc(h.note)}</div></div>`).join('')}<div class="row">${changeButtons(c)}</div></div>`).join('')}
else if(p==='databases'){const rows=await api('databases');html+=rows.map(d=>`<div class="card"><h3>${esc(d.name)} <span class="tag">${esc(d.engine)}</span></h3><p>${esc(d.host)} · 负责人 ${person(d.owner)} · ${esc(d.application)}</p><p>备份策略：${esc(d.backup_policy)}，保留 ${d.retention_days} 天</p><p>最近备份：${fmt(d.last_backup)} / ${esc(d.backup_status)}</p><h3>数据字典</h3>${table(['表名','估算行数','用途'],d.tables.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.rows.toLocaleString()}</td><td>${esc(t.description)}</td></tr>`))}<h3>慢查询摘要</h3>${d.slow_queries.map(q=>`<p><code>${esc(q.digest)}</code></p><p>p95 ${q.p95_ms}ms · ${q.calls} 次 · <a data-ticket="${esc(q.ticket)}">${esc(q.ticket)}</a></p>`).join('')}</div>`).join('')}
else if(p==='documents'||p==='announcements'){const rows=await api(p);html+=rows.map(d=>`<article class="card"><span class="muted">${esc(d.key)} ${d.revision?'· 修订 '+d.revision:''}</span><h3>${esc(d.title)}</h3><p class="desc">${esc(d.body)}</p><p class="muted">${person(d.author)} · ${fmt(d.updated_at||d.published_at)}</p></article>`).join('')}
else if(p==='audit'){const {rows}=await api('audit');html+='<div class="card">'+table(['序号','用户','方法','路径','状态','逻辑时间'],rows.slice(-100).reverse().map(r=>`<tr><td>${r.seq}</td><td>${person(r.user)}</td><td>${esc(r.method)}</td><td>${esc(r.path)}</td><td>${r.status}</td><td>${esc(r.ts_hlc)}</td></tr>`))+'</div>'}
$('view').innerHTML=html}
async function filter(){const rows=await api('tickets?q='+encodeURIComponent($('query').value)+'&status='+encodeURIComponent($('statusFilter').value));$('ticketTable').innerHTML=table(['编号','主题','状态','优先级','处理人','更新时间'],ticketRows(rows))}
function changeButtons(c){const rules={draft:['test','提交测试报告','test01'],tested:['approve','审批通过','manager01'],approved:['deploy','执行发布','ops01'],deployed:['rollback','执行回滚','ops01']};const r=rules[c.status];return r&&me.username===r[2]?`<button class="primary" data-change="${esc(c.key)}" data-version="${c.version}" data-operation="${r[0]}">${r[1]}</button>`:''}
async function ticket(key){current=await api('tickets/'+encodeURIComponent(key));const t=current;$('crumb').textContent='工单中心 / '+key;$('view').innerHTML=`<button data-action="back">← 返回列表</button><div class="card" style="margin-top:18px"><div class="row between"><h2>${esc(t.key)} · ${esc(t.title)}</h2>${tag(t.status)}</div><p class="desc">${esc(t.description)}</p><div class="kv"><span class="muted">所属应用</span><span>${esc(apps.find(a=>a.key===t.application)?.name||t.application)}</span><span class="muted">发起人 / 处理人</span><span>${person(t.reporter)} / ${person(t.assignee)}</span><span class="muted">创建 / 更新</span><span>${fmt(t.created_at)} / ${fmt(t.updated_at)}</span></div><div class="row"><select id="assignee">${people.map(p=>`<option value="${esc(p.username)}" ${p.username===t.assignee?'selected':''}>${esc(p.display_name)} · ${esc(p.department)}</option>`).join('')}</select><button data-action="assign">分派</button>${({open:['in_progress','closed'],in_progress:['resolved','closed'],resolved:['closed','in_progress'],closed:[]}[t.status]||[]).map(s=>`<button data-status="${s}">${s==='in_progress'?'开始 / 重新处理':labels[s]}</button>`).join('')}</div></div><div class="card"><h3>处理时间线</h3>${t.approval_flow.map(h=>`<div class="history">${person(h.actor)} · ${esc(h.action)} <span class="muted">${fmt(h.time)}</span><div>${esc(h.comment)}</div></div>`).join('')}</div><div class="card"><h3>沟通记录</h3>${t.comments.map(c=>`<div class="history">${person(c.user)} <span class="muted">${fmt(c.time)}</span><p class="desc">${esc(c.text)}</p></div>`).join('')}<textarea id="comment" placeholder="记录排查结果、验证步骤或补充信息"></textarea><button class="primary" data-action="comment">发表评论</button></div>`}
function modal(title,fields,submit){$('modal').innerHTML=`<form id="entryForm"><h2>${esc(title)}</h2>${fields}<div class="row"><button class="primary">提交</button><button type="button" id="cancel">取消</button></div><p id="formError" role="alert"></p></form>`;$('cancel').onclick=()=>$('modal').close();$('entryForm').onsubmit=async e=>{e.preventDefault();try{await submit(Object.fromEntries(new FormData(e.target)));$('modal').close();toast('操作已保存');go(page)}catch(ex){$('formError').textContent=ex.message}};$('modal').showModal()}
const field=(k,label,area=false)=>`<div class="field"><label>${label}</label>${area?`<textarea name="${k}" required></textarea>`:`<input name="${k}" required maxlength="200">`}</div>`;
$('view').onclick=async e=>{const el=e.target.closest('button,a');if(!el)return;try{if(el.dataset.ticket){await ticket(el.dataset.ticket);return}if(el.dataset.status){await api(`tickets/${current.key}/status`,{status:el.dataset.status,version:current.version});await ticket(current.key);return}if(el.dataset.change){modal(el.textContent,field('note','执行说明 / 验证证据',true),async d=>api(`changes/${el.dataset.change}/${el.dataset.operation}`,{...d,version:Number(el.dataset.version),passed:true}));return}switch(el.dataset.action){case'back':go('tickets');break;case'filter':await filter();break;case'assign':await api(`tickets/${current.key}/assign`,{assignee:$('assignee').value,version:current.version});await ticket(current.key);break;case'comment':await api(`tickets/${current.key}/comments`,{text:$('comment').value,version:current.version});await ticket(current.key);break;case'new-ticket':modal('新建服务工单',field('title','主题')+field('description','问题描述 / 影响范围',true)+`<div class="field"><label>应用</label><select name="application">${apps.map(a=>`<option value="${esc(a.key)}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>优先级</label><select name="priority"><option>P2-中</option><option>P1-高</option><option>P0-紧急</option><option>P3-低</option></select></div>`,d=>api('tickets',d));break;case'new-change':modal('申请变更',field('title','变更主题')+field('ticket','关联工单编号')+field('plan','执行方案',true)+field('rollback','回滚方案',true),d=>api('changes',d));break}}catch(ex){toast(ex.message)}};
if(token&&me)init();
</script></html>
