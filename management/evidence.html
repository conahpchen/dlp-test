<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话证据 · 蜜网管理</title>
<style>
body{font:16px system-ui;margin:0;background:#eef2f5;color:#1c2938}
header{padding:1rem 2rem;background:#17283f;color:white} header a{color:white}
main{max-width:65rem;margin:2rem auto;padding:0 1rem}
select,button{padding:.4rem;font:inherit} td,th{text-align:left;padding:.4rem;overflow-wrap:anywhere}
article{background:white;padding:1rem;margin:1rem 0;border-radius:.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}
dl div{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.35rem 0}
dd{margin:0;overflow-wrap:anywhere}
.table-scroll{overflow-x:auto}
tr:target{background:#d9eeeb}
</style>
<header><a href="/">返回运行总览</a></header>
<main>
<h1>会话证据</h1>
<label>研究场景 <select id="runs"></select></label>
<button id="refresh" type="button">刷新证据</button>
<p id="status" role="status"></p>
<h2>服务发布</h2><div id="release"></div>
<h2>Agent 登记</h2><div id="registrations"></div>
<h2>Canary 命中</h2><div id="canaries"></div>
<h2>Web 事件时间线</h2>
<label>筛选会话 <select id="sessions"><option value="">全部会话</option></select></label>
<p>下方 AI 生成记录会链接到它参考的事件。序号用于表示先后。</p>
<div class="table-scroll"><table>
<thead><tr><th>逻辑序号</th><th>会话</th><th>发生了什么</th><th>请求或交付内容</th><th>HTTP 状态</th><th>DWS 版本</th></tr></thead>
<tbody id="timeline"></tbody>
</table></div>
<h2>AI 生成记录</h2><div id="generation"></div>
</main>
<script>
const runs = document.querySelector('#runs');
const statusLine = document.querySelector('#status');
const registrations = document.querySelector('#registrations');
const canaries = document.querySelector('#canaries');
const timeline = document.querySelector('#timeline');
const releasePanel = document.querySelector('#release');
const fieldNames = {
  framework:'框架', model_family:'模型系列', instance_kind:'运行类型', task:'任务类别',
  registration_id:'登记编号', session:'观察会话', received_at:'接收时间', world_version:'世界版本',
  recorded_event_count:'记录事件数', hypothesis:'行为假设', confidence:'置信度', evidence_use:'证据编号',
  credential_id:'凭据标识', entry:'入口', associated:'有效关联', recorded_at:'观测时间', revision:'修订号'
};
async function get(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error('读取证据失败');
  return response.json();
}
function group(title, fields) {
  const section = document.createElement('section');
  const heading = document.createElement('h3');
  heading.textContent = title;
  section.append(heading);
  const list = document.createElement('dl');
  for (const [key,value] of Object.entries(fields)) {
    const row = document.createElement('div');
    const term = document.createElement('dt');
    const description = document.createElement('dd');
    term.textContent = fieldNames[key] ?? key;
    description.textContent = value;
    row.append(term,description);
    list.append(row);
  }
  section.append(list);
  return section;
}
function renderRelease(run, release) {
  const card = document.createElement('article');
  const state = document.createElement('p');
  state.textContent = release.active ? '当前发布' : '未激活';
  card.append(state);
  if (release.manifest) {
    for (const capability of release.manifest.capabilities) {
      const line = document.createElement('p');
      line.textContent = 'L' + capability.level + ' · ' + capability.protocol + ' · ' + capability.exposure;
      card.append(line);
    }
  }
  for (const attempt of release.attempts) {
    const line = document.createElement('p');
    line.textContent = attempt.recorded_at + ' · ' + attempt.status + (attempt.detail ? ' · ' + attempt.detail : '');
    card.append(line);
  }
  if (runs.selectedOptions[0]?.dataset.origin === 'ai') {
    const button = document.createElement('button');
    const action = release.active ? 'rollback' : 'activate';
    button.textContent = release.active ? '回滚当前场景' : '审批并激活场景';
    const isolated = document.createElement('input');
    if (action === 'activate') {
      isolated.type = 'checkbox';
      const caption = document.createElement('label');
      caption.append(isolated, '批准本机隔离服务实例');
      card.append(caption);
    }
    button.onclick = async () => {
      button.disabled = true;
      try {
        const response = await fetch('/api/evidence/runs/' + encodeURIComponent(run) + '/release/' + action + '?approve_isolated=' + isolated.checked, {
          method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'
        });
        const result = await response.json();
        await refresh();
        if (!response.ok) statusLine.textContent = result.detail;
      } catch (error) {
        statusLine.textContent = '无法更新发布状态';
      } finally {
        button.disabled = false;
      }
    };
    card.append(button);
  }
  releasePanel.replaceChildren(card);
}
const sessions = document.querySelector('#sessions');
const generation = document.querySelector('#generation');
let selectedEvidence;
const eventNames = {
  'web.request':'访问 Web', 'research.visit':'访问场景', 'research.delivery':'交付内容',
  'research.lead':'提供相关资料链接', 'research.input':'提交交互请求',
  'research.beacon':'核验链接命中', 'research.invalid_beacon':'核验链接未通过'
};
const resources = {
  '/':'OA 首页', '/ui':'OA 首页', '/api/documents':'知识库', '/api/tickets':'工单列表',
  '/api/databases':'数据库目录', '/api/assets':'资产列表', '/api/login':'登录',
  'unmatched':'未匹配已知路由', 'beacon':'核验链接'
};
const decisionNames = {applied:'已应用到会话', rejected:'未通过校验', stale:'已过期', pending:'处理中'};
function renderTimeline() {
  if (!selectedEvidence) return;
  const filter = sessions.value;
  const matches = item => !filter || item.session === filter;
  const timelineRows = selectedEvidence.timeline.filter(matches);
  const positions = new Map(selectedEvidence.timeline.map((event, index) => [event.event_id, index+1]));
  timeline.replaceChildren();
  for (const event of timelineRows) {
    const row = document.createElement('tr');
    row.id = 'event-' + event.event_id;
    const label = resources[event.resource];
    const target = [event.method, event.title || label, event.resource].filter(Boolean).join(' · ');
    const values = ['#'+positions.get(event.event_id), event.session, eventNames[event.kind] || event.kind,
      target || '未记录', event.status ?? '—', event.world_version ?? '—'];
    for (const value of values) {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.append(cell);
    }
    timeline.append(row);
  }
  generation.replaceChildren();
  for (const record of selectedEvidence.generation.filter(matches)) {
    const item = document.createElement('article');
    item.append(group(decisionNames[record.status] || record.status, {
      '会话': record.session, '推测意图': record.intent || '未记录',
      '提议新增或更新页面': record.nodes.map(node => node.title + '（' + node.id + '）').join('、') || '无',
      '提议模拟接口': record.services.map(service => service.method + ' ' + service.path).join('、') || '无'
    }));
    const evidence = document.createElement('p');
    evidence.append('依据事件：');
    for (const id of record.evidence_event_ids) {
      if (!positions.has(id)) continue;
      const link = document.createElement('a');
      link.href = '#event-' + id;
      link.textContent = '#' + positions.get(id);
      evidence.append(link, ' ');
    }
    item.append(evidence);
    generation.append(item);
  }
  if (!timelineRows.length) {
    const row = timeline.insertRow();
    const cell = row.insertCell();
    cell.colSpan = 6;
    cell.textContent = '暂无事件';
  }
  if (!generation.childElementCount) generation.textContent = '这个范围内暂无 AI 生成记录';
}
sessions.onchange = renderTimeline;
async function refresh() {
  try {
    const selected = runs.value;
    registrations.replaceChildren();
    canaries.replaceChildren();
    selectedEvidence = null;
    timeline.replaceChildren();
    generation.replaceChildren();
    releasePanel.replaceChildren();
    if (!selected) return;
    const evidence = await get('/api/evidence/runs/' + encodeURIComponent(selected));
    if (runs.value !== selected) return;
    statusLine.textContent = '';
    renderRelease(selected, evidence.release);
    if (!evidence.registrations.length) registrations.textContent = '暂无登记';
    if (!evidence.canary_uses.length) canaries.textContent = '暂无跨入口命中';
    for (const row of evidence.registrations) {
      const item = document.createElement('article');
      item.className = 'grid';
      item.append(group('自报信息',row.self_reported),group('服务端观测',row.server_observed),
                  group('行为推断',row.inferred));
      registrations.append(item);
    }
    const previousSession = sessions.value;
    sessions.replaceChildren(new Option('全部会话', ''));
    for (const session of new Set([...evidence.timeline, ...evidence.generation].map(row => row.session))) {
      sessions.add(new Option(session, session));
    }
    if (Array.from(sessions.options).some(option => option.value === previousSession)) sessions.value = previousSession;
    selectedEvidence = evidence;
    renderTimeline();
    for (const row of evidence.canary_uses) {
      const {history,use_id,...fields} = row;
      const item = document.createElement('article');
      item.append(group('凭据使用证据', {evidence_use:use_id,...fields}));
      if (history.length) {
        const list = document.createElement('ul');
        for (const revision of history) {
          const line = document.createElement('li');
          line.textContent = '修订 ' + revision.revision + ' · ' + revision.reason;
          list.append(line);
        }
        item.append(list);
      }
      canaries.append(item);
    }
  } catch (error) {
    statusLine.textContent = error.message;
  }
}
async function start() {
  try {
    const rows = await get('/api/evidence/runs');
    for (const row of rows) {
      const option = new Option(row.run_id + ' · DWS ' + row.world_version,row.run_id);
      option.dataset.origin = row.origin;
      runs.add(option);
    }
    if (!rows.length) statusLine.textContent = '暂无研究场景';
    await refresh();
  } catch (error) {
    statusLine.textContent = error.message;
  }
}
runs.onchange = refresh;
document.querySelector('#refresh').onclick = refresh;
start();
</script>
</html>
